#
# Benesse TAB-A04-BR3 (MediaTek MT8167)
#
# Boot image layout accepted by the stock A04BR3 LK, as used by the working
# edk2-mtk A04BR3Pkg (package_boot_image.py) and the A04BR3 XNU device
# repository (tools/bootimg.py, board.json):
#   Android boot image v0, 2048-byte pages, kernel at 0x40080000, ramdisk at
#   0x80000000, tags (DTB copy, x0) at 0x4E000000, second at 0x40F00000;
#   the command line must start with "bootopt=64S3,32N2,64N2" (read by the
#   preloader; selects the 64-bit non-secure kernel boot);
#   kernel = MediaTek "KERNEL" header + gzip(BootShim + FD) padded to 512
#   bytes + appended DTB, ramdisk = MediaTek "ROOTFS" header + payload.
#

#
# Boot Shim Configs
#
# LK decompresses the shim and the FD to 0x40080000; the shim copies the FD
# to FD_BASE (0x41080000, the FD address of edk2-mtk A04BR3).
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0x41080000
size = 0x00300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true
mtk_header         = true

#
# Android Boot Image Configs
#
[boot_image]
header_version = 0
base           = 0x40000000
kernel_offset  = 0x00080000
ramdisk_offset = 0x40000000
second_offset  = 0x00F00000
tags_offset    = 0x0E000000
pagesize       = 2048
cmdline        = "bootopt=64S3,32N2,64N2"
